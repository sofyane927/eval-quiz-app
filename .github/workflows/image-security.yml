name: Image security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-scan:
    name: Build and scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
          - image: backend
            context: ./backend
    env:
      IMAGE: quiz-${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
        run: docker build --tag "$IMAGE" "$BUILD_CONTEXT"

      - name: Block critical vulnerabilities
        run: bash scripts/scan-image.sh "$IMAGE"

      - name: Demonstrate a blocked critical finding
        if: matrix.image == 'frontend'
        run: |
          temp="$(mktemp -d)"
          cat > "$temp/docker" <<'SH'
          #!/usr/bin/env bash
          set -eu
          if [[ "$1" == save ]]; then
            printf 'Synthetic image archive\n'
          else
            cat >/dev/null
            [[ "$1" == run && "$*" == *"--severity CRITICAL --exit-code 1"* ]]
            echo "::error::Demonstration only: simulated Trivy critical finding"
            exit 1
          fi
          SH
          chmod +x "$temp/docker"
          PATH="$temp:$PATH" bash scripts/scan-image.sh "$IMAGE"
